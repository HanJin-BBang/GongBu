<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff1c8"><link rel="manifest" href="./manifest.webmanifest"><title>공부 놀이터 🌈</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#fff9ed;color:#473c55;user-select:none}header{background:#ffe5a6;padding:13px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px}h1{font-size:clamp(20px,5vw,28px);margin:0}button{border:0;border-radius:20px;background:#fff;color:#493858;box-shadow:0 3px 0 #d9c7b0;font-size:clamp(17px,4.3vw,24px);font-weight:800;min-height:55px;padding:10px;touch-action:manipulation;cursor:pointer}button:active{transform:translateY(2px);box-shadow:0 1px 0 #d9c7b0}button:focus-visible{outline:4px solid #5d8afa}main{max-width:820px;margin:auto;padding:12px}.choose{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.choose button{font-size:clamp(19px,5vw,26px);padding:12px 4px}.choose .selected{background:#c8f4dd}.canvasbox{margin:12px 0;background:white;border:5px solid #ffdf9a;border-radius:26px;overflow:hidden;position:relative}.art{width:100%;height:auto;display:block;max-height:53vh;touch-action:manipulation}.art .paint{stroke:#554a58;stroke-width:5;stroke-linejoin:round;cursor:pointer;transition:fill .15s}.art .line{fill:none;stroke:#554a58;stroke-width:6;stroke-linecap:round;pointer-events:none}.art .moving{transform-box:fill-box;transform-origin:center}.canvasbox.playing .bounce{animation:bounce 1.1s ease-in-out infinite alternate}.canvasbox.playing .flutter{animation:flutter .35s ease-in-out infinite alternate}.canvasbox.playing .drive{animation:drive 2.2s ease-in-out infinite alternate}@keyframes bounce{to{transform:translateY(-28px)}}@keyframes flutter{to{transform:rotate(12deg) scaleX(.88)}}@keyframes drive{to{transform:translateX(55px)}}.palette{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin:12px 0}.color{min-height:52px;border:4px solid white;border-radius:18px;padding:0;box-shadow:0 2px 0 #d9c7b0}.color.selected{outline:4px solid #6e57c8;outline-offset:0}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.actions button{background:#d6f4ff}.music{margin-top:12px;padding:12px;background:#f5e3ff;border-radius:23px;display:grid;grid-template-columns:65px 1fr 65px;gap:8px;align-items:center;text-align:center}.music button{min-height:60px;background:white}.music #playMusic{min-height:52px;background:#fff}.music-name{font-size:17px;font-weight:800;margin-bottom:7px}.info{text-align:center;font-size:13px;color:#746781;padding:8px}#message{min-height:24px;text-align:center;font-weight:800;color:#9b3d86}@media(max-width:380px){main{padding:8px}.palette{gap:5px}.color{min-height:44px}.actions button{font-size:15px}.music{grid-template-columns:52px 1fr 52px}.music button{min-height:54px}}
@media(prefers-reduced-motion:reduce){.canvasbox.playing *{animation:none!important}}
</style></head><body><header><h1>🌈 공부 놀이터</h1><button id="install" aria-label="홈 화면에 추가">🏠 +</button></header><main><div class="choose" aria-label="그림 고르기"><button data-art="rabbit" class="selected">🐰 토끼</button><button data-art="butterfly">🦋 나비</button><button data-art="car">🚗 자동차</button></div><div class="canvasbox" id="canvasbox"><svg id="art" class="art" viewBox="0 0 400 360" role="img" aria-label="그림에서 색칠할 부분을 터치하세요"></svg></div><div class="palette" id="palette" aria-label="색상 고르기"></div><div class="actions"><button id="undo">↶ 다시</button><button id="clear">🧼 지우기</button><button id="animate">▶ 움직여!</button></div><p id="message" aria-live="polite">색을 고르고 그림을 콕 눌러봐!</p><div class="music"><button id="prevSong" aria-label="이전 음악">〈</button><div><div class="music-name" id="songName">🎵 반짝 산책</div><button id="playMusic">▶ 음악</button></div><button id="nextSong" aria-label="다음 음악">〉</button></div><p class="info">광고 없음 · 외부 링크 없음 · 소리는 버튼을 누르면 시작돼요<br>음악은 이 앱을 위해 만든 짧은 창작 멜로디예요.</p></main><script src="./app.js"></script><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
